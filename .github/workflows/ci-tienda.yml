name: CI Tienda de Empanadas

# El flujo se va a disparar cada vez que hagas un push a la rama main
on:
  push:
    branches: [ main ]

jobs:
  build-image:
    name: Buildear Imagen de Docker
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Descargar el código del repositorio en la máquina virtual
    - name: Checkout del código
      uses: actions/checkout@v4

    # Paso 2: Configurar el entorno de Docker en el servidor de GitHub
    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Paso 3: Correr el build de prueba para asegurar que la app compila bien
    - name: Build de la imagen
      run: |
        docker build -t tienda-test:latest .