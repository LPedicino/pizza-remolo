name: CI Tienda de Empanadas

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Buildear y Subir Imagen a GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Nos logueamos en el registro privado de GitHub usando credenciales automáticas
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Convertimos el nombre del usuario a minúsculas para evitar errores de Docker
    - name: Downcase repo owner
      run: |
        echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
      env:
        OWNER: ${{ github.repository_owner }}

    # Buildeamos y subimos a tu registro privado
    - name: Build y Push de la imagen
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ env.OWNER_LC }}/pizza-remolo-frontend:latest